services:
  # The Postgres Database Service
  db:
    image: postgres:15-alpine
    container_name: vsi-postgres
    environment:
      POSTGRES_USER: vsi_user
      POSTGRES_PASSWORD: vsi_password
      POSTGRES_DB: voice_sentiment_db
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped

  # pgAdmin Web Dashboard for Postgres
  pgadmin:
    image: dpage/pgadmin4
    container_name: vsi-pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@admin.com
      PGADMIN_DEFAULT_PASSWORD: admin
    ports:
      - "5050:80"
    depends_on:
      - db
    restart: unless-stopped

  # The Backend Service (FastAPI)
  backend:
    build: ./backend
    container_name: vsi-backend
    ports:
      - "8000:8000"
    depends_on:
      - db
    volumes:
      # Persist AI model caches so they are NOT re-downloaded on every restart.
      # Whisper caches models to ~/.cache/whisper
      # HuggingFace (PyAnnote + RoBERTa) caches models to ~/.cache/huggingface
      - ai_model_cache:/root/.cache
    environment:
      - ENV=production
      - DATABASE_URL=postgresql://vsi_user:vsi_password@db:5432/voice_sentiment_db
      - HF_TOKEN=${HF_AUTH_TOKEN}
    env_file:
      - ./backend/.env
    restart: unless-stopped

  # The Frontend Service (React + Nginx)
  frontend:
    build: ./frontend
    container_name: vsi-frontend
    ports:
      - "80:80"     # Map port 80 of the host to port 80 of the container
    depends_on:
      - backend     # Ensure backend starts before frontend
    restart: unless-stopped

volumes:
  postgres_data:
  # Named volume for AI model caches (Whisper + HuggingFace).
  # Survives container restarts — models download once, then load from disk.
  ai_model_cache:
